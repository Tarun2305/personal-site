name: Update Feeds

on:
  schedule:
    - cron: '0 */3 * * *' # Every three hours
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: true

# Explicitly give the action permission to write to the repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run fetch script
        run: python fetch_feeds.py

      - name: Commit and push data.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit"
          else
            git commit -m "Auto-update feed data"
            git push
          fi
