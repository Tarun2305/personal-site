<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="description" content="A personal reading desk for news, Chelsea, music, film, and long-form writing.">
    <meta name="theme-color" content="#f6f5ef">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <title>Reading desk</title>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to stories</a>

    <div class="app-shell">
        <div class="scrim" id="scrim" hidden></div>

        <aside class="sidebar" id="sidebar" aria-label="Reading desk navigation">
            <div class="sidebar-brand">
                <span class="brand-mark" aria-hidden="true">≋</span>
                <span>Reading desk</span>
                <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close menu">×</button>
            </div>

            <nav class="primary-nav" id="primary-nav">
                <button class="nav-item is-active" type="button" data-view="today">
                    <span>Today</span><span class="nav-count" id="today-count"></span>
                </button>
                <button class="nav-item" type="button" data-view="saved">
                    <span>Saved</span><span class="nav-count" id="saved-count">0</span>
                </button>
                <button class="nav-item" type="button" data-view="history">
                    <span>History</span><span class="nav-count" id="history-count">0</span>
                </button>

                <p class="nav-label">Sections</p>
                <div id="category-nav"></div>

                <p class="nav-label">Tools</p>
                <button class="nav-item" type="button" data-view="archive"><span>Archive lookup</span></button>
            </nav>

            <p class="sidebar-note">Saved and read states stay on this device.</p>
        </aside>

        <main class="main-content" id="main-content">
            <header class="mobile-header">
                <button class="icon-button" id="menu-button" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
                <span id="mobile-title">Today</span>
                <button class="icon-button" id="mobile-search" type="button" aria-label="Search stories">⌕</button>
            </header>

            <div class="content-wrap">
                <header class="view-header">
                    <div>
                        <p class="eyebrow" id="view-eyebrow">Your reading desk</p>
                        <h1 id="view-title">Today</h1>
                    </div>
                    <div class="view-actions" id="view-actions">
                        <label class="search-control">
                            <span class="visually-hidden">Filter stories and sources</span>
                            <input id="search-input" type="search" placeholder="Filter stories…" autocomplete="off">
                        </label>
                        <label class="sort-control">
                            <span class="visually-hidden">Sort stories</span>
                            <select id="sort-select">
                                <option value="newest">Newest first</option>
                                <option value="oldest">Oldest first</option>
                                <option value="source">By source</option>
                            </select>
                        </label>
                    </div>
                </header>

                <section class="source-directory" id="source-directory" aria-label="Sources in this section"></section>
                <section class="story-list" id="story-list" aria-live="polite" aria-busy="true"></section>
                <button class="load-more" id="load-more" type="button" hidden>Load more</button>

                <section class="empty-state" id="empty-state" hidden>
                    <span class="empty-glyph" aria-hidden="true">☕</span>
                    <h2 id="empty-title">Nothing here yet</h2>
                    <p id="empty-description">Try another section or clear your filter.</p>
                </section>

                <section class="archive-view" id="archive-view" hidden>
                    <form class="archive-form" id="archive-form" novalidate>
                        <label for="archive-input">Find the newest archived copy of a page</label>
                        <div class="archive-row">
                            <input type="url" id="archive-input" placeholder="Paste a URL" autocomplete="url" inputmode="url">
                            <button class="primary-button" type="submit">Find archive</button>
                        </div>
                        <div id="archive-result" role="status" aria-live="polite"></div>
                    </form>
                </section>
            </div>
        </main>

        <nav class="bottom-nav" aria-label="Mobile navigation">
            <button class="bottom-nav-item is-active" type="button" data-view="today"><span aria-hidden="true">☷</span><span>Today</span></button>
            <button class="bottom-nav-item" type="button" data-view="saved"><span aria-hidden="true">☆</span><span>Saved</span></button>
            <button class="bottom-nav-item" id="bottom-sections" type="button"><span aria-hidden="true">☰</span><span>Sections</span></button>
        </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="story-template">
        <article class="story-card">
            <div class="swipe-cue swipe-cue-save" aria-hidden="true">Save</div>
            <div class="swipe-cue swipe-cue-dismiss" aria-hidden="true">Dismiss</div>
            <div class="story-card-inner">
                <div class="story-meta">
                    <span class="story-source"></span>
                    <span class="story-dot" aria-hidden="true">·</span>
                    <time class="story-time"></time>
                    <span class="new-badge" hidden>New</span>
                </div>
                <a class="story-title" href="#"></a>
                <p class="story-excerpt"></p>
                <div class="story-actions">
                    <button class="text-button save-button" type="button">Save</button>
                    <button class="text-button read-button" type="button">Mark read</button>
                    <button class="text-button dismiss-button" type="button">Dismiss</button>
                </div>
            </div>
        </article>
    </template>

    <noscript><p class="noscript">JavaScript is required to load and organize the reading desk.</p></noscript>
    <script src="app.js" defer></script>
</body>
</html>
